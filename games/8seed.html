<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>8seed - Pure Random Turbo</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #252525; padding: 10px; border-radius: 6px; border: 1px solid #444; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 90%; background: #111; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; }
        button { width: 100%; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; }
        .btn-start { background: #00c853; color: #000; }
        .btn-stop { background: #ff1744; color: #fff; }
        .stats-bar { display: flex; justify-content: space-between; background: #000; padding: 15px; border-radius: 8px; margin: 20px 0; font-family: monospace; font-size: 1.2em; border-left: 4px solid #00c853; }
        .log { height: 400px; overflow-y: auto; background: #080808; border: 1px solid #333; padding: 10px; font-family: monospace; font-size: 13px; }
        .entry { color: #00e676; border-bottom: 1px solid #222; padding: 6px 0; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0; color:#00c853;">8seed Pure Random <small style="color:#666">i7-6700 Optimized</small></h2>
    
    <div class="grid">
        <div class="card"><label>Min God Tiles</label><input type="number" id="minGod" value="2"></div>
        <div class="card"><label>Target XY (5,5)</label><input type="text" id="targetXY" placeholder="Any"></div>
        <div class="card"><label>Threads</label><input type="number" id="threads" value="7"></div>
        <div class="card"><label>Batch Size</label><input type="number" id="batchSize" value="25000"></div>
    </div>

    <button id="mainBtn" class="btn-start" onclick="toggle()">START PURE RANDOM SEARCH</button>

    <div class="stats-bar">
        <span>SEEDS: <span id="statSeeds" style="color:#00c853">0</span></span>
        <span>SPEED: <span id="statSpeed">0</span>/s</span>
        <span>FOUND: <span id="statFound" style="color:#00c853">0</span></span>
    </div>

    <div class="log" id="log"></div>
</div>

<script>
    let workers = [];
    let running = false;
    let seedsChecked = 0;
    let found = 0;
    let startT = 0;

    function toggle() {
        const btn = document.getElementById('mainBtn');
        if (running) {
            workers.forEach(w => w.terminate());
            workers = [];
            running = false;
            btn.innerText = "START PURE RANDOM SEARCH";
            btn.className = "btn-start";
            return;
        }

        running = true;
        btn.innerText = "STOP SEARCHING";
        btn.className = "btn-stop";
        
        seedsChecked = 0;
        found = 0;
        startT = Date.now();
        document.getElementById('log').innerHTML = "";

        const threadCount = parseInt(document.getElementById('threads').value);
        const batchSize = parseInt(document.getElementById('batchSize').value);
        const minGod = parseInt(document.getElementById('minGod').value);
        const target = document.getElementById('targetXY').value;

        for (let i = 0; i < threadCount; i++) {
            const w = new Worker('worker.js');
            w.onmessage = (e) => {
                if (e.data.type === 'stat') {
                    seedsChecked += e.data.count;
                    const sec = (Date.now() - startT) / 1000;
                    document.getElementById('statSeeds').innerText = seedsChecked.toLocaleString();
                    document.getElementById('statSpeed').innerText = Math.floor(seedsChecked / sec).toLocaleString();
                } else if (e.data.type === 'found') {
                    found++;
                    document.getElementById('statFound').innerText = found;
                    const div = document.createElement('div');
                    div.className = 'entry';
                    div.innerHTML = `<span>SEED: ${e.data.seed}</span> <span>${e.data.coords.join(' | ')}</span>`;
                    const log = document.getElementById('log');
                    log.insertBefore(div, log.firstChild);
                }
            };
            w.postMessage({ bombCount: 21, minMatches: minGod, targetCoord: target, batchSize: batchSize });
            workers.push(w);
        }
    }
</script>
</body>
</html>
